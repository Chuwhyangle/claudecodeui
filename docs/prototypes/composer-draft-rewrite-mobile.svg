<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" role="img" aria-labelledby="title desc">
<title id="title">草稿润色：手机端简化交互</title><desc id="desc">两张手机 composer 状态。原草稿保留在输入框，润色入口位于同一 composer 内；服务端另读最近 1 条 assistant + 上一条 user 作为参考。展开框只有候选正文与应用、重试图标，没有标题或状态副文案。点击框内容区收起，底部发送行为不变。</desc>
<defs><style>
.bg{fill:#f3f4f6}.screen{fill:#faf9f7;stroke:#cdd3db;stroke-width:1.5}.ink{fill:#252b33;font:13px system-ui,sans-serif}.muted{fill:#7c8794;font:11px system-ui,sans-serif}.tiny{fill:#929ba6;font:10px system-ui,sans-serif}.title{fill:#17212b;font:bold 19px system-ui,sans-serif}.h{fill:#27323e;font:bold 13px system-ui,sans-serif}.message{fill:#f0eeeb;stroke:#e5e1dc;stroke-width:1}.composer{fill:#fff;stroke:#e1e4e8;stroke-width:1.3}.chip{fill:#fff;stroke:#bfc8d3;stroke-width:1;stroke-dasharray:3 2}.candidate{fill:#f3f6fd;stroke:#d6e1fa;stroke-width:1}.primary{fill:#7ea0f5}.primaryText{fill:#fff;font:bold 12px system-ui,sans-serif}.iconButton{fill:#fff;stroke:#cbd3dd;stroke-width:1}.rule{stroke:#e8eaed;stroke-width:1}
</style></defs>
<rect class="bg" width="920" height="900"/>
<text x="24" y="37" class="title">草稿润色 · 手机端简化版</text><text x="24" y="60" class="muted">不另占 footer 控件位；候选在当前输入框内部展开，正文编辑与发送逻辑保持原样。</text>
<!-- collapsed -->
<text x="43" y="98" class="h">① 收起：草稿仍在 textarea，润色 chip 在下方</text>
<rect x="28" y="112" width="410" height="730" rx="30" class="screen"/>
<text x="48" y="145" class="h">☰　Project　⌄　···</text><line x1="29" y1="161" x2="437" y2="161" class="rule"/>
<rect x="208" y="200" width="209" height="55" rx="13" class="message"/><text x="222" y="224" class="tiny">已发送消息仍只在 transcript</text><text x="222" y="242" class="tiny">draft 不会被提前提交</text>
<rect x="42" y="600" width="382" height="222" rx="14" class="composer"/>
<text x="60" y="627" class="muted">textarea · 当前未发送草稿</text>
<text x="60" y="655" class="ink">嗯我想问一下，那个方案如果</text><text x="60" y="676" class="ink">今天还没定，我们是不是先按</text><text x="60" y="697" class="ink">之前说的那个做？</text>
<rect x="59" y="710" width="91" height="28" rx="14" class="chip"/><text x="75" y="729" class="ink">✦ 润色</text>
<line x1="43" y1="748" x2="423" y2="748" class="rule"/>
<text x="59" y="777" class="ink">⌕　♩　◖))　···</text><text x="332" y="777" class="tiny">权限</text><rect x="378" y="760" width="33" height="35" rx="9" class="primary"/><text x="389" y="783" class="primaryText">➤</text>
<text x="48" y="813" class="tiny">发送按钮照常可用。</text>
<!-- expanded -->
<text x="483" y="98" class="h">② 展开：框内只有候选和图标操作</text>
<rect x="468" y="112" width="410" height="730" rx="30" class="screen"/>
<text x="488" y="145" class="h">☰　Project　⌄　···</text><line x1="469" y1="161" x2="877" y2="161" class="rule"/>
<rect x="654" y="200" width="208" height="55" rx="13" class="message"/><text x="668" y="224" class="tiny">assistant: 支付流程方案先走 A，</text><text x="668" y="242" class="tiny">测试后补（作为上下文参考）</text>
<rect x="482" y="448" width="382" height="374" rx="14" class="composer"/>
<text x="500" y="475" class="tiny">同一个 textarea · 原文仍在这里</text>
<text x="500" y="500" class="ink">嗯我想问一下，那个方案如果</text><text x="500" y="521" class="ink">今天还没定，我们是不是先按</text><text x="500" y="542" class="ink">之前说的那个做？</text>
<rect x="499" y="558" width="348" height="134" rx="10" class="candidate"/>
<rect x="781" y="566" width="28" height="27" rx="7" class="iconButton"/><text x="789" y="585" class="ink">✓</text>
<rect x="815" y="566" width="28" height="27" rx="7" class="iconButton"/><text x="821" y="585" class="ink">↻</text>
<text x="514" y="600" class="ink">如果今天还无法确定支付流程方案，</text><text x="514" y="621" class="ink">我们可以先按之前讨论的方向推进吗？</text>
<text x="514" y="676" class="tiny">点候选区收起；按钮提示：应用到草稿 / 重试</text>
<line x1="483" y1="710" x2="863" y2="710" class="rule"/>
<text x="499" y="741" class="ink">⌕　♩　◖))　···</text><text x="772" y="741" class="tiny">权限</text><rect x="818" y="723" width="33" height="35" rx="9" class="primary"/><text x="829" y="746" class="primaryText">➤</text>
<text x="489" y="781" class="tiny">Send 仍照常发送 textarea 内容；候选只有点 ✓ 才应用。</text>
<text x="489" y="813" class="tiny">点建议框文字/空白处收回 chip；再次打开沿用原候选，不重复请求。</text>
<text x="489" y="843" class="tiny">Settings → Diagnostics：草稿润色调试日志默认关闭；开启会把当前草稿、最近对话上下文与候选原文写入</text>
<text x="489" y="865" class="tiny">~/.cloudpit/reply-suggestions-debug.jsonl（仅本机、不上传、不参与遥测；轮转是唯一保留策略）。</text>
</svg>
